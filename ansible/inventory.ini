# ==============================================================================
# Ansible Production & Staging Target Node Inventory
# ==============================================================================

[staging]
staging-cart-01 ansible_host=192.168.1.110 env_name=staging app_port=8080 api_port=5001

[production]
prod-cart-01 ansible_host=192.168.1.120 env_name=production app_port=80 api_port=5000
prod-cart-02 ansible_host=192.168.1.121 env_name=production app_port=80 api_port=5000

[cart_servers:children]
staging
production

[cart_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
app_dir=/opt/docker-shopping-cart
backup_dir=/opt/docker-shopping-cart/backups
docker_compose_cmd="docker compose"
health_probe_url="http://localhost:5000/api/health"
