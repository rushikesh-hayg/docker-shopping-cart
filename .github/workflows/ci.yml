name: CI/CD Quality Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax & Lint Verification
        run: |
          node --check backend/src/server.js

      - name: Verify Environment Configuration Template
        run: |
          test -f .env.example

      - name: Package Release Artifact
        run: |
          tar -czvf shopping-cart-build.tar.gz frontend/ backend/ .env.example package.json

      - name: Archive Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopping-cart-build
          path: shopping-cart-build.tar.gz
          